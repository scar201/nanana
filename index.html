        /* === Custom Properties === */
        :root {
            --rmz-bg: #0a0a0f;
            --rmz-surface: rgba(255,255,255,0.04);
            --rmz-surface-hover: rgba(255,255,255,0.07);

        /* === Glass Card === */

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* === Skeleton Loading === */
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .skeleton-animate {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0.03) 75%);

            animation: skeleton-loading 1.5s infinite;

        /* === Swiper Overrides === */
        .swiper-pagination-bullet { background: rgba(255,255,255,0.3) !important; opacity: 1 !important; }

        .products-swiper .swiper-button-next:after,

        .products-swiper .swiper-button-prev:hover { transform: scale(1.1); }
        .products-swiper .swiper-button-disabled { opacity: 0.3; }
        @media (max-width: 768px) {
            .products-swiper .swiper-button-next,
            .products-swiper .swiper-button-prev { display: none; }

        /* === Native <select> options ===
           Browsers fall back to OS-default styling for the dropdown panel
           (white background + dark text), which is unreadable inside the
           dark theme — especially the highlighted row, which on Chrome/Linux
           uses light blue + white. Force a dark surface + light text so the
           options match the rest of the storefront. macOS Safari ignores
           these rules but the panel is OS-native there anyway. */
        select option,
        select optgroup {
            background-color: #1a1a1f;
            color: #fff;
        }
        select option:checked,
        select option:hover {
            background-color: #2a2a30;

        /* === Print === */
        @media print {

            .print-area, .print-area * { visibility: visible; }

    <!-- Pixel Events Helper #RMZGG Integrations -->
<script type="5f419077e0f0367b479bb3a9-text/javascript">
/**
 * RMZ Pixel Events Helper
 * Provides utility functions for tracking e-commerce events across Facebook, TikTok, and Snapchat pixels
 */
// Ensure dataLayer exists even if the GTM snippet hasn't executed yet.
// This prevents a race where early calls to RMZPixel happen before GTM
// initializes the array (e.g. a very fast page_view → add_to_cart flow).
window.dataLayer = window.dataLayer || [];

window.RMZPixel = window.RMZPixel || {
    /**
     * Map display currency symbols to ISO 4217 codes.
     * Google Ads / GA4 require ISO codes (SAR, USD, EUR) — Arabic
     * symbols like ر.س are silently ignored and purchases show $0.
     */
    _currencyMap: {
        'ر.س': 'SAR', 'ريال': 'SAR',
        '$': 'USD',
        '€': 'EUR',
        'د.إ': 'AED',
        'د.ب': 'BHD',
        'د.ك': 'KWD',
        'ر.ع': 'OMR',
        'ر.ق': 'QAR',
        'ج.م': 'EGP',
        '₺': 'TRY',
        'د.م': 'MAD',
        '£': 'GBP',
        'ر.ي': 'YER',
        'د.ج': 'DZD',
        'د.ت': 'TND',
        'د.ل': 'LYD',
        'د.ع': 'IQD',
        'ل.ل': 'LBP',
        'ل.س': 'SYP',
        'د.أ': 'JOD'
    },

    _normalizeCurrency: function(val) {
        if (!val) return 'SAR';
        var mapped = this._currencyMap[val];
        if (mapped) return mapped;
        // Already an ISO code (e.g. SAR, USD) — uppercase it
        return val.toUpperCase();
    },

    /**
     * Check if Snapchat Pixel is available
     */
    isSnapPixelAvailable: function() {
        return typeof snaptr === 'function';
    },

    /**
     * Push a GA4 Enhanced Ecommerce event to Google Tag Manager's dataLayer.
     * Schema mirrors GA4's Enhanced Ecommerce spec (event, currency, value,
     * items[]) so standard GA4 Event tags in merchant GTM containers work
     * out of the box.
     *
     * Never throws — tracking errors must not break the storefront.
     */
    _gtm: function(event, params) {
        try {
            if (typeof window === 'undefined') return;
            window.dataLayer = window.dataLayer || [];
            var payload = { event: event };
            if (params) {
                for (var k in params) {
                    if (Object.prototype.hasOwnProperty.call(params, k)) {
                        payload[k] = params[k];
                    }
                }
            }
            window.dataLayer.push(payload);
        } catch (e) { /* swallow — tracking must never break the storefront */ }
    },

    /**
     * Internal helper: normalize a single product into a GA4 `items[]` entry.
     */
    _gtmItem: function(product) {
        return {
            item_id: String(product.id != null ? product.id : ''),
            item_name: product.name || '',
            item_category: product.category || '',
            price: Number(product.price) || 0,
            quantity: Number(product.quantity) || 1
        };
    },

    /**
     * Track ViewContent event - when a product page is viewed
     */
    viewContent: function(product) {
        var currency = this._normalizeCurrency(product.currency);

        // Facebook Pixel
        if (typeof fbq === 'function') {
            fbq('track', 'ViewContent', {
                content_ids: [product.id],
                content_name: product.name,
                content_type: 'product',
                content_category: product.category || '',
                value: product.price,
                currency: currency
            });
        }

        // TikTok Pixel
        if (typeof ttq === 'object' && ttq !== null) {
            ttq.track('ViewContent', {
                content_id: String(product.id),
                content_name: product.name,
                content_type: 'product',
                content_category: product.category || '',
                price: product.price,
                value: product.price,
                currency: currency
            });
        }

        // Snapchat Pixel
        if (this.isSnapPixelAvailable()) {
            snaptr('track', 'VIEW_CONTENT', {
                item_ids: [String(product.id)],
                item_category: product.category || '',
                price: product.price,
                currency: currency
            });
        }

        // Google Tag Manager (GA4 Enhanced Ecommerce: view_item)
        this._gtm('view_item', {
            currency: currency,
            value: Number(product.price) || 0,
            items: [this._gtmItem(Object.assign({}, product, { quantity: 1 }))]
        });
    },

    /**
     * Track AddToCart event
     */
    addToCart: function(product) {
        var currency = this._normalizeCurrency(product.currency);
        var quantity = product.quantity || 1;
        var value = product.price * quantity;

        // Facebook Pixel
        if (typeof fbq === 'function') {
            fbq('track', 'AddToCart', {
                content_ids: [product.id],
                content_name: product.name,
                content_type: 'product',
                value: value,
                currency: currency,
                contents: [{
                    id: product.id,
                    quantity: quantity
                }]
            });
        }

        // TikTok Pixel
        if (typeof ttq === 'object' && ttq !== null) {
            ttq.track('AddToCart', {
                content_id: String(product.id),
                content_name: product.name,
                content_type: 'product',
                price: product.price,
                value: value,
                currency: currency,
                quantity: quantity
            });
        }

        // Snapchat Pixel
        if (this.isSnapPixelAvailable()) {
            snaptr('track', 'ADD_CART', {
                item_ids: [String(product.id)],
                item_category: product.category || '',
                price: value,
                currency: currency,
                number_items: quantity
            });
        }

        // Google Tag Manager (GA4 Enhanced Ecommerce: add_to_cart)
        this._gtm('add_to_cart', {
            currency: currency,
            value: value,
            items: [this._gtmItem(Object.assign({}, product, { quantity: quantity }))]
        });
    },

    /**
     * Track InitiateCheckout event
     */
    initiateCheckout: function(data) {
        var currency = this._normalizeCurrency(data.currency);
        var value = data.value || 0;

        // Facebook Pixel
        if (typeof fbq === 'function') {
            var fbData = {
                value: value,
                currency: currency,
                content_type: 'product'
            };

            if (data.products && data.products.length > 0) {
                fbData.content_ids = data.products.map(function(p) { return p.id; });
                fbData.contents = data.products.map(function(p) {
                    return { id: p.id, quantity: p.quantity || 1 };
                });
                fbData.num_items = data.products.reduce(function(sum, p) {
                    return sum + (p.quantity || 1);
                }, 0);
            }

            fbq('track', 'InitiateCheckout', fbData);
        }

        // TikTok Pixel
        if (typeof ttq === 'object' && ttq !== null) {
            var ttData = {
                value: value,
                currency: currency,
                content_type: 'product'
            };

            if (data.products && data.products.length > 0) {
                ttData.contents = data.products.map(function(p) {
                    return {
                        content_id: String(p.id),
                        content_name: p.name,
                        quantity: p.quantity || 1,
                        price: p.price
                    };
                });
            }

            ttq.track('InitiateCheckout', ttData);
        }

        // Snapchat Pixel
        if (this.isSnapPixelAvailable()) {
            var snapData = {
                price: value,
                currency: currency
            };

            if (data.products && data.products.length > 0) {
                snapData.item_ids = data.products.map(function(p) { return String(p.id); });
                snapData.number_items = data.products.reduce(function(sum, p) {
                    return sum + (p.quantity || 1);
                }, 0);
            }

            snaptr('track', 'START_CHECKOUT', snapData);
        }

        // Google Tag Manager (GA4 Enhanced Ecommerce: begin_checkout)
        var gtmItems = [];
        if (data.products && data.products.length > 0) {
            for (var i = 0; i < data.products.length; i++) {
                gtmItems.push(this._gtmItem(data.products[i]));
            }
        }
        this._gtm('begin_checkout', {
            currency: currency,
            value: value,
            items: gtmItems
        });
    },

    /**
     * Track Purchase/CompletePayment event - after successful order
     */
    purchase: function(data) {
        var currency = this._normalizeCurrency(data.currency);
        var value = data.value || 0;

        // Facebook Pixel
        if (typeof fbq === 'function') {
            var fbData = {
                value: value,
                currency: currency,
                content_type: 'product'
            };

            if (data.products && data.products.length > 0) {
                fbData.content_ids = data.products.map(function(p) { return p.id; });
                fbData.contents = data.products.map(function(p) {
                    return { id: p.id, quantity: p.quantity || 1 };
                });
                fbData.num_items = data.products.reduce(function(sum, p) {
                    return sum + (p.quantity || 1);
                }, 0);
            }

            fbq('track', 'Purchase', fbData);
        }

        // TikTok Pixel
        if (typeof ttq === 'object' && ttq !== null) {
            // Advanced Matching: identify must be called before track so the
            // purchase event carries email/phone (TikTok hashes them client-side;
            // without this, Events Manager raises "Email and phone are missing").
            if (data.customer && (data.customer.email || data.customer.phone)) {
                var ttIdentity = {};
                if (data.customer.email) ttIdentity.email = data.customer.email;
                if (data.customer.phone) {
                    // E.164 expected; strip stray formatting characters defensively.
                    ttIdentity.phone_number = String(data.customer.phone).replace(/[^\d+]/g, '');
                }
                ttq.identify(ttIdentity);
            }

            var ttData = {
                value: value,
                currency: currency,
                content_type: 'product'
            };

            if (data.products && data.products.length > 0) {
                ttData.contents = data.products.map(function(p) {
                    return {
                        content_id: String(p.id),
                        content_name: p.name,
                        quantity: p.quantity || 1,
                        price: p.price
                    };
                });
            }

            ttq.track('CompletePayment', ttData);
        }

        // Snapchat Pixel
        if (this.isSnapPixelAvailable()) {
            var snapData = {
                price: value,
                currency: currency,
                transaction_id: data.orderId ? String(data.orderId) : ''
            };

            if (data.products && data.products.length > 0) {
                snapData.item_ids = data.products.map(function(p) { return String(p.id); });
                snapData.number_items = data.products.reduce(function(sum, p) {
                    return sum + (p.quantity || 1);
                }, 0);
            }

            snaptr('track', 'PURCHASE', snapData);
        }

        // Google Tag Manager (GA4 Enhanced Ecommerce: purchase)
        var gtmPurchaseItems = [];
        if (data.products && data.products.length > 0) {
            for (var j = 0; j < data.products.length; j++) {
                gtmPurchaseItems.push(this._gtmItem(data.products[j]));
            }
        }
        this._gtm('purchase', {
            transaction_id: data.orderId != null ? String(data.orderId) : '',
            currency: currency,
            value: value,
            tax: Number(data.tax) || 0,
            shipping: Number(data.shipping) || 0,
            items: gtmPurchaseItems
        });
    },

    /**
     * Track Search event
     */
    search: function(query, category) {
        // Facebook Pixel
        if (typeof fbq === 'function') {
            fbq('track', 'Search', {
                search_string: query,
                content_category: category || ''
            });
        }

        // TikTok Pixel
        if (typeof ttq === 'object' && ttq !== null) {
            ttq.track('Search', {
                query: query,
                content_category: category || ''
            });
        }

        // Snapchat Pixel
        if (this.isSnapPixelAvailable()) {
            snaptr('track', 'SEARCH', {
                search_string: query
            });
        }

        // Google Tag Manager (GA4: search)
        this._gtm('search', {
            search_term: query || '',
            content_category: category || ''
        });
    },

    /**
     * Track Lead/SubmitForm event - when customer registers
     */
    lead: function() {
        // Facebook Pixel
        if (typeof fbq === 'function') {
            fbq('track', 'Lead');
        }

        // TikTok Pixel
        if (typeof ttq === 'object' && ttq !== null) {
            ttq.track('SubmitForm');
        }

        // Snapchat Pixel
        if (this.isSnapPixelAvailable()) {
            snaptr('track', 'SIGN_UP');
        }

        // Google Tag Manager (GA4: generate_lead)
        this._gtm('generate_lead', {});
    },

    /**
     * Track CompleteRegistration event
     */
    completeRegistration: function() {
        // Facebook Pixel
        if (typeof fbq === 'function') {
            fbq('track', 'CompleteRegistration');
        }

        // TikTok Pixel
        if (typeof ttq === 'object' && ttq !== null) {
            ttq.track('CompleteRegistration');
        }

        // Snapchat Pixel
        if (this.isSnapPixelAvailable()) {
            snaptr('track', 'SIGN_UP');
        }

        // Google Tag Manager (GA4: sign_up)
        this._gtm('sign_up', { method: 'email' });
    },

    /**
     * Track ViewItemList event (GTM/GA4 only — no equivalent Meta/TikTok pixel event).
     *
     * Called from category, products, and index templates when a list of
     * products is rendered. Lets GA4 attribute "impression" metrics to the
     * right list placement for Enhanced Ecommerce reporting.
     *
     * @param {string} listName - e.g. "Home Featured", "Category: Vouchers"
     * @param {Array}  products - array of product objects {id, name, price, category, quantity}
     */
    viewItemList: function(listName, products) {
        if (!products || !products.length) return;
        var items = [];
        for (var i = 0; i < products.length; i++) {
            var item = this._gtmItem(products[i]);
            item.index = i;
            item.item_list_name = listName || '';
            items.push(item);
        }
        this._gtm('view_item_list', {
            item_list_name: listName || '',
            items: items
        });
    },

    /**
     * Track ViewCart event (GTM/GA4 only).
     *
     * Called when the cart modal opens. Mirrors the standard GA4 view_cart
     * event so merchants can measure cart-view → checkout conversion.
     *
     * @param {object} cartData - {value, currency, products[]}
     */
    viewCart: function(cartData) {
        var currency = this._normalizeCurrency(cartData && cartData.currency);
        var value = Number(cartData && cartData.value) || 0;
        var items = [];
        if (cartData && cartData.products && cartData.products.length) {
            for (var i = 0; i < cartData.products.length; i++) {
                items.push(this._gtmItem(cartData.products[i]));
            }
        }
        this._gtm('view_cart', {
            currency: currency,
            value: value,
            items: items
        });
    },

    /**
     * Track RemoveFromCart event (GTM/GA4 only — no Meta/TikTok parity yet).
     *
     * Called from the cart modal when a line item is removed.
     */
    removeFromCart: function(product) {
        var currency = this._normalizeCurrency(product && product.currency);
        var quantity = Number(product && product.quantity) || 1;
        var value = (Number(product && product.price) || 0) * quantity;
        this._gtm('remove_from_cart', {
            currency: currency,
            value: value,
            items: [this._gtmItem(product || {})]
        });
    },

    /**
     * Track AddPaymentInfo event (GTM/GA4 only).
     *
     * Called on the payment page before the gateway handoff. Lets merchants
     * measure begin_checkout → add_payment_info drop-off in GA4 funnels.
     */
    addPaymentInfo: function(data) {
        var currency = this._normalizeCurrency(data && data.currency);
        var value = Number(data && data.value) || 0;
        var items = [];
        if (data && data.products && data.products.length) {
            for (var i = 0; i < data.products.length; i++) {
                items.push(this._gtmItem(data.products[i]));
            }
        }
        this._gtm('add_payment_info', {
            currency: currency,
            value: value,
            payment_type: (data && data.paymentType) || '',
            items: items
        });
    },

    /**
     * Track AddShippingInfo event (GTM/GA4 only).
     *
     * RMZ products are digital so shipping rarely applies, but GA4 standard
     * funnels include this step. Exposed for merchants who want it.
     */
    addShippingInfo: function(data) {
        var currency = this._normalizeCurrency(data && data.currency);
        var value = Number(data && data.value) || 0;
        var items = [];
        if (data && data.products && data.products.length) {
            for (var i = 0; i < data.products.length; i++) {
                items.push(this._gtmItem(data.products[i]));
            }
        }
        this._gtm('add_shipping_info', {
            currency: currency,
            value: value,
            shipping_tier: (data && data.shippingTier) || '',
            items: items
        });
    }
};

        stars.push({

          y: Math.random(),
          z: Math.random() * 0.85 + 0.15,
          r: Math.random() * 2.2 + 0.6,
          a: Math.random() * 0.45 + 0.55,
          tw: Math.random() * Math.PI * 2,
        });
      }
    }

      mouse.y += (target.y - mouse.y) * 0.08;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var ox = (mouse.x - 0.5) * 70;
      var oy = (mouse.y - 0.5) * 70;

        s.tw += 0.025 + s.z * 0.025;
        var twinkle = 0.65 + Math.sin(s.tw) * 0.35;
        var px = s.x * canvas.width + ox * s.z;

    <script type="5f419077e0f0367b479bb3a9-text/javascript">
        // Mobile menu
        function openMobileMenu() {
            document.getElementById('mobileOverlay').classList.add('active');
            document.getElementById('mobileDrawer').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeMobileMenu() {
            document.getElementById('mobileOverlay').classList.remove('active');
            document.getElementById('mobileDrawer').classList.remove('active');
            document.body.style.overflow = '';
        }

        // Lazy load product sections — batch fetch all at once on page load
        document.addEventListener('DOMContentLoaded', function() {
            var containers = document.querySelectorAll('.products-lazy-container');
            if (!containers.length) return;

            var componentMap = {};
            containers.forEach(function(el) {
                componentMap[el.dataset.componentId] = { el: el, isGrid: el.dataset.isGrid === '1' };
            });

            var ids = Object.keys(componentMap);

            function renderComponent(el, html, isGrid) {
                if (!html) return;
                var skeleton = el.querySelector('.products-skeleton');
                var content = el.querySelector('.products-content');
                if (skeleton) skeleton.style.display = 'none';
                if (content) {
                    content.innerHTML = html;
                    content.style.display = 'block';
                    content.classList.add('loaded');
                }

                if (!isGrid) {
                    var swiperEl = content.querySelector('.products-swiper');
                    if (swiperEl) {
                        new Swiper(swiperEl, {
                            slidesPerView: 'auto',
                            spaceBetween: 16,
                            navigation: {
                                nextEl: swiperEl.querySelector('.swiper-button-next'),
                                prevEl: swiperEl.querySelector('.swiper-button-prev'),
                            },
                            breakpoints: {
                                320: { slidesPerView: 1.3 },
                                640: { slidesPerView: 2.3 },
                                1024: { slidesPerView: 3.5 },
                                1280: { slidesPerView: 4 },
                            }
                        });
                    }

                    var hint = el.closest('section')?.querySelector('.swipe-hint');
                    if (hint) hint.style.display = 'block';
                }
            }

            if (ids.length === 1) {
                fetch('/api/component/' + ids[0] + '/products', {
                    method: 'GET',
                    headers: { 'Accept': 'application/json', 'X-Requested-With': 'XMLHttpRequest' }
                })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.success && data.html) {
                        renderComponent(componentMap[ids[0]].el, data.html, componentMap[ids[0]].isGrid);
                    }
                });
            } else {
                fetch('/api/components/products/batch?ids=' + ids.join(','), {
                    method: 'GET',
                    headers: { 'Accept': 'application/json', 'X-Requested-With': 'XMLHttpRequest' }
                })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (!data.success || !data.components) return;
                    ids.forEach(function(id) {
                        renderComponent(componentMap[id].el, data.components[id] || '', componentMap[id].isGrid);
                    });
                });
            }

            // Init reviews swiper
            var reviewsSwiper = document.querySelector('.reviews-swiper');
            if (reviewsSwiper) {
                new Swiper(reviewsSwiper, {
                    slidesPerView: 1,
                    spaceBetween: 20,
                    pagination: {
                        el: '.reviews-pagination',
                        clickable: true,
                    },
                    breakpoints: {
                        640: { slidesPerView: 2 },
                        1024: { slidesPerView: 3 },
                    }
                });
            }
        });

        // FAQ toggle
        function toggleFaq(button) {
            var item = button.closest('.faq-item');
            var isActive = item.classList.contains('active');
            document.querySelectorAll('.faq-item').forEach(function(el) {
                el.classList.remove('active');
            });
            if (!isActive) {
                item.classList.add('active');
            }
        }

        function toggleShowMoreFaq(button) {
            var isExpanded = button.classList.contains('expanded');
            var hiddenItems = document.querySelectorAll('.faq-hidden');
            var textSpan = button.querySelector('.show-more-text');

            if (isExpanded) {
                var items = Array.from(hiddenItems).reverse();
                items.forEach(function(item, index) {
                    setTimeout(function() {
                        item.classList.remove('faq-visible');
                        setTimeout(function() { item.style.display = 'none'; }, 300);
                    }, index * 50);
                });
                button.classList.remove('expanded');
                textSpan.textContent = 'عرض المزيد';
            } else {
                hiddenItems.forEach(function(item, index) {
                    item.style.display = 'block';
                    setTimeout(function() { item.classList.add('faq-visible'); }, index * 50 + 10);
                });
                button.classList.add('expanded');
                textSpan.textContent = 'عرض أقل';
            }
        }
    </script>
